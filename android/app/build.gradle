plugins {
    id 'com.android.application'
}

// ---------------------------------------------------------------------------
// SDL2 source tree (see android/README.md)
// ---------------------------------------------------------------------------
def sdl2Prop = project.findProperty('uzdoom.sdl2Dir') ?: 'deps/SDL'
def sdl2Dir = new File(sdl2Prop)
if (!sdl2Dir.isAbsolute()) {
    sdl2Dir = new File(rootProject.projectDir, sdl2Prop)
}
def sdl2Path = sdl2Dir.absolutePath.replace('\\', '/')

if (!new File(sdl2Dir, 'CMakeLists.txt').exists()) {
    logger.warn("SDL2 source tree not found at ${sdl2Path}. " +
            "Run android/scripts/fetch-deps.sh (or set uzdoom.sdl2Dir in gradle.properties).")
}

// The PK3s have to be generated on the host and dropped into assets/.
def assetsDir = file('src/main/assets')
def requiredAssets = ['uzdoom.pk3', 'game_support.pk3', 'brightmaps.pk3', 'lights.pk3',
                      'game_widescreen_gfx.pk3']

// ---------------------------------------------------------------------------
// Release signing
//
// A CI run decodes the keystore from a secret and exports the four
// UZDROID_KEY* variables; a local build can instead put the same values in
// android/keystore.properties (gitignored). Without either, release builds are
// signed with the debug key so that the APK stays installable.
// ---------------------------------------------------------------------------
def signingProperties = new Properties()
def signingPropertiesFile = rootProject.file('keystore.properties')
if (signingPropertiesFile.exists()) {
    signingPropertiesFile.withInputStream { signingProperties.load(it) }
}

def signingValue = { String propertyName, String environmentName ->
    System.getenv(environmentName) ?: signingProperties.getProperty(propertyName)
}

def releaseStorePath = signingValue('storeFile', 'UZDROID_KEYSTORE_FILE')
def releaseStoreFile = releaseStorePath ? new File(releaseStorePath) : null
def hasReleaseKey = releaseStoreFile != null && releaseStoreFile.isFile()

// ci sets these so that artifacts are versioned per build.
def appVersionCode = (System.getenv('UZDROID_VERSION_CODE') ?: '1') as Integer
def appVersionName = System.getenv('UZDROID_VERSION_NAME') ?: '0.1.0'

// Sharing one ccache between builds cuts the native rebuild from tens of
// minutes to a couple. Off unless asked for, because a local ccache would also
// apply to non-Android builds.
def useCcache = System.getenv('UZDROID_CCACHE') == '1'

// Toolchain versions. The defaults are what AGP and Android Studio install; CI
// overrides them to match whatever the runner image actually has.
def ndkVersionToUse = System.getenv('UZDROID_NDK_VERSION') ?: '27.0.12077973'
def cmakeVersionToUse = System.getenv('UZDROID_CMAKE_VERSION') ?: '3.22.1'

android {
    namespace 'org.uzdoom.uzdroid'
    compileSdk 35
    // Pinned so that a newer NDK appearing on a build machine cannot silently
    // change the toolchain.
    ndkVersion ndkVersionToUse

    defaultConfig {
        applicationId 'org.uzdoom.uzdroid'
        minSdk 24
        targetSdk 34
        versionCode appVersionCode
        versionName appVersionName

        // The engine is 64 bit only.
        ndk {
            abiFilters 'arm64-v8a'
        }

        externalNativeBuild {
            cmake {
                arguments "-DUZDOOM_SDL2_SOURCE_DIR=${sdl2Path}"
                if (useCcache) {
                    arguments '-DCMAKE_C_COMPILER_LAUNCHER=ccache',
                              '-DCMAKE_CXX_COMPILER_LAUNCHER=ccache'
                }
            }
        }
    }

    externalNativeBuild {
        cmake {
            // The engine's own CMakeLists doubles as the Android build script.
            path '../../CMakeLists.txt'
            // SDL2 still declares cmake_minimum_required(3.0), which CMake 4
            // refuses, so this must never resolve to 4.x.
            version cmakeVersionToUse
        }
    }

    signingConfigs {
        if (hasReleaseKey) {
            release {
                storeFile releaseStoreFile
                storePassword signingValue('storePassword', 'UZDROID_KEYSTORE_PASSWORD')
                keyAlias signingValue('keyAlias', 'UZDROID_KEY_ALIAS')
                keyPassword signingValue('keyPassword', 'UZDROID_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        debug {
            jniDebuggable true
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Debug signing keeps unsigned builds installable on devices.
            signingConfig hasReleaseKey ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // Keep the .so files as real files inside the app's lib directory: the
    // engine dlopen()s libopenal.so by soname and that is the path it looks in.
    packaging {
        jniLibs {
            useLegacyPackaging = true
        }
    }

    lint {
        abortOnError false
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
}

// ---------------------------------------------------------------------------
// Host-side PK3 generation
//
// zipdir/lemon/re2c are host tools, so the PK3s cannot be produced by the NDK
// build. This task shells out to a script that builds them with the host
// toolchain and copies them into assets/.
// ---------------------------------------------------------------------------
tasks.register('hostAssets', Exec) {
    workingDir rootProject.projectDir
    commandLine 'bash', 'scripts/build-host-assets.sh'
    onlyIf {
        !requiredAssets.every { new File(assetsDir, it).exists() }
    }
    ignoreExitValue = true
    doLast {
        if (execResult.exitValue != 0) {
            throw new GradleException(
                    "Could not generate the engine PK3 assets.\n" +
                    "Run 'bash android/scripts/build-host-assets.sh' manually and check its output " +
                    "(see android/README.md, section 'Engine data').")
        }
    }
}

tasks.matching { it.name == 'preBuild' }.configureEach {
    dependsOn 'hostAssets'
}
