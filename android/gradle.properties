# Gradle / AGP settings for the UZDroid Android launcher.
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

android.useAndroidX=true
android.nonTransitiveRClass=true

# Path to an SDL2 source tree (2.0.6 or newer). Relative paths are resolved
# against the android/ directory. android/scripts/fetch-deps.sh puts one in
# android/deps/SDL, which is what the default below expects.
uzdoom.sdl2Dir=deps/SDL
