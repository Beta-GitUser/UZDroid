name: Android APK

# Builds the Android wrapper (see android/README.md) and publishes an
# installable APK as a workflow artifact. Nothing Android-related needs to be
# installed locally.
#
# For a *signed* release build, add these under Settings -> Secrets and
# variables -> Actions (without them the APK is signed with the debug key,
# which installs fine but cannot update an app signed with another key):
#
#   ANDROID_KEYSTORE_BASE64    base64 -w0 release.jks
#   ANDROID_KEYSTORE_PASSWORD  keystore password
#   ANDROID_KEY_ALIAS          key alias
#   ANDROID_KEY_PASSWORD       key password

on:
  push:
    branches: ['**']
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/ISSUE_TEMPLATE/**'
  pull_request:
  workflow_dispatch:
    inputs:
      variant:
        description: 'Which APK to build'
        type: choice
        options: [release, debug, both]
        default: release
        required: true

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 180

    env:
      UZDROID_CCACHE: '1'
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 2G
      CCACHE_COMPRESS: '1'
      # Preferred toolchain versions; the SDK step keeps them if the runner
      # image has them and otherwise picks the closest one it does have.
      PREFERRED_NDK_VERSION: '27.3.13750724'
      PREFERRED_CMAKE_VERSION: '3.22.1'
      # Points at the file the "Decode keystore" step writes. When the secret is
      # absent the file is absent too and gradle falls back to debug signing.
      UZDROID_KEYSTORE_FILE: ${{ github.workspace }}/release.jks
      UZDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      UZDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      UZDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      VARIANT: ${{ inputs.variant }}

    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # Installs Gradle 8.9 itself instead of going through ./gradlew: the
      # wrapper jar in the repo is not in gradle/actions' known-good list, and
      # using the distribution keeps CI independent of it.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          validate-wrappers: false

      - name: Install host tools
        run: |
          cat > /tmp/host-tools.sh <<'SH'
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ccache ninja-build python3
          cmake --version | head -1
          ccache --version | head -1
          SH
          .github/scripts/ci-run.sh "$GITHUB_WORKSPACE/host-tools.log" bash /tmp/host-tools.sh

      - name: Prepare Android SDK, NDK and CMake
        run: |
          cat > /tmp/sdk.sh <<'SH'
          set -euo pipefail
          sdk="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          echo "ANDROID_HOME=$sdk" >> "$GITHUB_ENV"

          # sdkmanager closes its input early, which makes `yes` die of SIGPIPE;
          # under pipefail that would abort the step, hence the || true.
          install_pkg() {
              echo "installing sdk package $1"
              { yes 2>/dev/null || true; } | sdkmanager --install "$1" 2>&1 | tail -3 || true
          }

          install_pkg "cmake;$PREFERRED_CMAKE_VERSION"
          install_pkg "ndk;$PREFERRED_NDK_VERSION"

          echo "--- installed ---"
          ls -d "$sdk"/cmake/* "$sdk"/ndk/* 2>/dev/null || true

          # CMake 4 refuses cmake_minimum_required below 3.5, which SDL2 still
          # uses, so never pick 4.x.
          cmake_version="$(ls -d "$sdk"/cmake/* 2>/dev/null | sed 's|.*/||' | sort -V | awk -F. '$1 < 4' | tail -1)"
          [ -n "$cmake_version" ] || { echo "no CMake 3.x found in the SDK"; exit 1; }

          # Same for the NDK: prefer the 27.x line that AGP 8.7 knows about.
          ndk_version="$(ls -d "$sdk"/ndk/* 2>/dev/null | sed 's|.*/||' | grep '^27\.' | sort -V | tail -1)"
          [ -n "$ndk_version" ] || ndk_version="$(ls -d "$sdk"/ndk/* 2>/dev/null | sed 's|.*/||' | sort -V | tail -1)"
          [ -n "$ndk_version" ] || { echo "no NDK found in the SDK"; exit 1; }

          {
            echo "UZDROID_CMAKE_VERSION=$cmake_version"
            echo "UZDROID_NDK_VERSION=$ndk_version"
            echo "NDK_ROOT=$sdk/ndk/$ndk_version"
          } >> "$GITHUB_ENV"

          echo "cmake $cmake_version, ndk $ndk_version"
          SH
          .github/scripts/ci-run.sh "$GITHUB_WORKSPACE/sdk.log" bash -x /tmp/sdk.sh

      - name: Version stamp
        run: |
          {
            echo "UZDROID_VERSION_CODE=${{ github.run_number }}"
            echo "UZDROID_VERSION_NAME=0.1.${{ github.run_number }}"
          } >> "$GITHUB_ENV"

      # Host-native and quick, but this is what fills the APK, so its failures
      # get their own annotation.
      - name: Fetch SDL2
        run: .github/scripts/ci-run.sh "$GITHUB_WORKSPACE/sdl.log" ./android/scripts/fetch-deps.sh

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-${{ github.sha }}
          restore-keys: |
            ccache-

      - name: Build engine data (PK3s)
        env:
          UZDROID_CCACHE: '0'
        run: .github/scripts/ci-run.sh "$GITHUB_WORKSPACE/pk3.log" ./android/scripts/build-host-assets.sh

      # Sound, but not worth failing the build over: without libopenal.so the
      # engine runs silently and says so in its log.
      - name: Build openal-soft (optional)
        continue-on-error: true
        env:
          UZDROID_CCACHE: '0'
        run: ./android/scripts/build-openal.sh

      # The engine is ~1500 translation units. A configure on its own takes a
      # minute and catches build-wiring mistakes long before the build does.
      - name: CMake configure smoke test
        run: |
          cat > /tmp/configure.sh <<'SH'
          set -euo pipefail
          cmake -S . -B /tmp/configure-check -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$NDK_ROOT/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-24 \
            -DANDROID_STL=c++_static \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DUZDOOM_SDL2_SOURCE_DIR="$GITHUB_WORKSPACE/android/deps/SDL" \
            -DIMPORT_EXECUTABLES="$GITHUB_WORKSPACE/build-host-assets/ImportExecutables.cmake"
          SH
          .github/scripts/ci-run.sh "$GITHUB_WORKSPACE/configure.log" bash /tmp/configure.sh

      - name: Decode keystore
        if: env.KEYSTORE_BASE64 != ''
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$UZDROID_KEYSTORE_FILE"
          echo "Release keystore ready ($(stat -c%s "$UZDROID_KEYSTORE_FILE") bytes)"

      - name: Build APK
        working-directory: android
        run: |
          cat > /tmp/build.sh <<'SH'
          set -euo pipefail
          case "${VARIANT:-}" in
            debug) tasks=assembleDebug ;;
            both)  tasks="assembleDebug assembleRelease" ;;
            *)     tasks=assembleRelease ;;
          esac
          echo "variant: ${VARIANT:-default} -> $tasks"
          gradle --no-daemon --stacktrace --console=plain $tasks
          SH
          ../.github/scripts/ci-run.sh "$GITHUB_WORKSPACE/build.log" bash /tmp/build.sh

      - name: Summarise result
        if: always()
        run: |
          shopt -s nullglob
          apks=(android/app/build/outputs/apk/**/*.apk)
          if [ ${#apks[@]} -eq 0 ]; then
            echo "### No APK produced" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "### APKs" >> "$GITHUB_STEP_SUMMARY"
          for apk in "${apks[@]}"; do
            size="$(du -h "$apk" | cut -f1)"
            bytes="$(stat -c %s "$apk")"
            echo "- \`$(basename "$apk")\` - $size" >> "$GITHUB_STEP_SUMMARY"
            # A notice is visible in the run overview, which is handy when the
            # artifact is not accessible.
            echo "::notice::$(basename "$apk"): $size ($bytes bytes)"
            libs="$(unzip -l "$apk" 2>/dev/null | grep -c 'lib/arm64-v8a/.*\.so' || true)"
            biggest="$(unzip -l "$apk" 2>/dev/null | grep 'lib/arm64-v8a/.*\.so' | sort -k1 -n | tail -3 | awk '{printf "%s(%dKB) ", $4, $1/1024}' || true)"
            echo "::notice::native libraries: ${libs:-0} -> ${biggest:-none}"
            # The engine cannot start without its own PK3s, so say whether they
            # made it into the APK instead of leaving that to the first launch.
            assets="$(unzip -l "$apk" 2>/dev/null | grep -c ' assets/' || true)"
            if unzip -l "$apk" 2>/dev/null | grep -q ' assets/uzdoom.pk3'; then
              echo "::notice::assets: ${assets} entries, uzdoom.pk3 present"
            else
              echo "::error::assets/uzdoom.pk3 is missing from the APK - the engine will not start"
            fi
          done
          signer="$(ls "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1 || true)"
          if [ -n "$signer" ]; then
            certs="$("$signer" verify --print-certs "${apks[0]}" 2>&1 | grep -i 'certificate DN\|Signer #1' | head -3 || true)"
            echo "### Signing" >> "$GITHUB_STEP_SUMMARY"
            printf '%s\n' "$certs" | sed 's/^/- /' >> "$GITHUB_STEP_SUMMARY"
            case "$certs" in
              *"Android Debug"*) echo "::warning::APK is signed with the debug key - the keystore secrets did not take effect" ;;
              *CERTIFICATE*|*certificate*) echo "::notice::signer: $(printf '%s' "$certs" | tr '\n' ' ' | cut -c1-200)" ;;
              *) echo "::notice::signer report: $(printf '%s' "$certs" | tr '\n' ' ' | cut -c1-200)" ;;
            esac
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: uzdroid-apk-${{ github.run_number }}
          path: android/app/build/outputs/apk/**/*.apk
          if-no-files-found: warn
          retention-days: 30

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ github.run_number }}
          path: |
            build.log
            sdl.log
            pk3.log
            configure.log
            sdk.log
            host-tools.log
            android/app/.cxx/**/*.log
            android/app/.cxx/**/*.txt
          if-no-files-found: ignore
          retention-days: 14
